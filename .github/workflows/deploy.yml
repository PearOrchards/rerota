name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd rerota
            nvm use .
            git pull origin main
            # Cannot omit dev as next build fails
            npm ci
            npx prisma migrate deploy
            npx prisma generate
            npx next build
            pm2 restart rerota