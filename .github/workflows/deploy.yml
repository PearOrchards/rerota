name: Build and Push Docker Image
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/pearorchards/rerota:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Deploy the New Container
        run: |
          # Stop and remove the old container (don't fail if it doesn't exist yet)
          docker rm -f rerota-app || true
          
          # Run the freshly built image
          docker run -d \
            --name rerota-app \
            --restart unless-stopped \
            -p 5002:3000 \
            --env-file /home/pear/rerota/.env \
            ghcr.io/pearorchards/rerota:latest
          
          # Clean up old dangling images so your server's hard drive doesn't fill up
          docker image prune -f